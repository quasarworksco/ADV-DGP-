<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotización — DGP Global Group</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#172b5e">
  <meta name="color-scheme" content="light dark">
  <link rel="icon"             href="/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg:#eef4fa; --card:#ffffff; --tx:#0f1b33; --tx2:#475569; --tx3:#94a3b8; --line:#e6edf5; --soft:#f5f9fc;
      --navy:#172b5e; --azul:#166baf; --turq:#3eaedd; --acc:#166baf; --acc-soft:#eaf5fb; --acc-line:rgba(22,107,175,.22);
      --ok:#059669; --ok-soft:#ecfdf5; --ok-tx:#065f46; --warn-soft:#fffbeb; --warn-tx:#92400e; --err:#dc2626;
      --input:#ffffff; --input-line:#dbe4ee; --shadow:0 20px 60px rgba(15,27,51,.10);
      --total:linear-gradient(120deg,#172b5e 0%,#166baf 60%,#3eaedd 100%);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#070f22; --card:#0f1b38; --tx:#eaf3ff; --tx2:#a9bedb; --tx3:#6f86a8; --line:#1d2d52; --soft:#132349;
        --acc:#5cc3ec; --acc-soft:rgba(62,174,221,.10); --acc-line:rgba(62,174,221,.28);
        --ok:#10b981; --ok-soft:rgba(16,185,129,.12); --ok-tx:#6ee7b7; --warn-soft:rgba(245,158,11,.12); --warn-tx:#fcd34d; --err:#f87171;
        --input:#0b1630; --input-line:#223463; --shadow:0 20px 60px rgba(0,0,0,.45);
      }
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); font-family:'Inter','IBM Plex Sans',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 16px; color:var(--tx); }
    .card { background:var(--card); max-width:540px; width:100%; border-radius:22px; overflow:hidden; box-shadow:var(--shadow); border:1px solid var(--line); }
    .head { background:linear-gradient(150deg,#0b1633 0%,#172b5e 45%,#166baf 85%,#3eaedd 125%); padding:30px 32px 28px; position:relative; }
    .head.ok { background:linear-gradient(150deg,#053b2e 0%,#065f46 45%,#059669 100%); }
    .head.no { background:linear-gradient(150deg,#1e293b,#475569); }
    .brandrow { display:flex; align-items:center; gap:12px; margin-bottom:22px; }
    .brandrow img { width:42px; height:42px; object-fit:contain; display:block; }
    .brand { font-family:'Poppins',sans-serif; font-weight:700; font-size:15px; letter-spacing:2.5px; color:#fff; line-height:1.1; }
    .brand-sub { font-size:11px; letter-spacing:.5px; color:#9fdcf4; margin-top:3px; }
    .title { font-family:'Poppins',sans-serif; font-weight:700; font-size:32px; color:#fff; letter-spacing:-.3px; line-height:1.1; }
    .docnum { font-size:13px; color:#9fdcf4; margin-top:6px; letter-spacing:1.5px; font-weight:500; }
    .badge { display:inline-flex; align-items:center; gap:7px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,.25); color:#fff; font-size:10px; font-weight:600; letter-spacing:1.8px; padding:6px 14px; border-radius:20px; margin-top:14px; text-transform:uppercase; backdrop-filter:blur(8px); }
    .badge::before { content:''; width:7px; height:7px; border-radius:50%; background:#3eaedd; box-shadow:0 0 0 3px rgba(62,174,221,.25); }
    .head.ok .badge::before { background:#6ee7b7; box-shadow:0 0 0 3px rgba(110,231,183,.25); }
    .head.no .badge::before { background:#cbd5e1; box-shadow:none; }
    .body { padding:26px 32px 0; }
    .meta { display:flex; justify-content:space-between; gap:12px; margin-bottom:20px; padding-bottom:18px; border-bottom:1px solid var(--line); }
    .meta-label { font-size:9.5px; font-weight:600; letter-spacing:1.8px; text-transform:uppercase; color:var(--acc); margin-bottom:4px; }
    .meta-value { font-family:'Poppins',sans-serif; font-size:14px; font-weight:600; color:var(--tx); }
    .meta-value.warn { color:#d97706; }
    .client { border-radius:14px; padding:14px 16px; margin-bottom:20px; background:var(--acc-soft); border:1px solid var(--acc-line); }
    .client-label { font-size:9.5px; font-weight:600; letter-spacing:1.8px; text-transform:uppercase; color:var(--acc); margin-bottom:4px; }
    .client-name { font-family:'Poppins',sans-serif; font-weight:600; font-size:19px; color:var(--tx); }
    .nota { background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:11px 14px; margin-bottom:20px; font-size:12.5px; color:var(--tx2); line-height:1.55; white-space:pre-wrap; }
    table { width:100%; border-collapse:collapse; }
    thead th { font-size:9.5px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--acc); padding:0 10px 9px; text-align:left; border-bottom:2px solid var(--acc-line); }
    thead th:first-child { padding-left:2px; } thead th:last-child { padding-right:2px; }
    tbody td { padding:13px 10px; font-size:13px; color:var(--tx2); border-bottom:1px solid var(--line); vertical-align:top; }
    tbody td:first-child { padding-left:2px; color:var(--tx); font-weight:500; }
    tbody td:last-child { padding-right:2px; font-weight:600; color:var(--tx); }
    .num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
    .ctr { text-align:center; }
    .total { margin:18px 32px 0; padding:20px 22px; border-radius:18px; display:flex; justify-content:space-between; align-items:center; gap:12px; background:var(--total); box-shadow:0 12px 30px rgba(22,107,175,.25); }
    .total-label { font-size:10px; font-weight:600; letter-spacing:2.5px; text-transform:uppercase; color:#bfe9fa; }
    .total-amount { font-family:'Poppins',sans-serif; font-weight:700; font-size:32px; color:#fff; line-height:1; }
    .resp { margin:24px 32px 0; }
    .resp h3 { font-family:'Poppins',sans-serif; font-size:15px; font-weight:600; margin-bottom:4px; color:var(--tx); }
    .resp p { font-size:12.5px; color:var(--tx2); line-height:1.55; margin-bottom:14px; }
    .field { margin-bottom:10px; }
    .field label, .g-lbl { display:block; font-size:10px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--tx2); margin-bottom:6px; }
    .field input, .field textarea, .g-in { width:100%; padding:12px 14px; border:1.5px solid var(--input-line); border-radius:12px; font-size:14px; font-family:inherit; outline:none; background:var(--input); color:var(--tx); }
    .field input::placeholder, .field textarea::placeholder, .g-in::placeholder { color:var(--tx3); }
    .field input:focus, .field textarea:focus, .g-in:focus { border-color:var(--turq); box-shadow:0 0 0 3px rgba(62,174,221,.18); }
    .btns { display:grid; grid-template-columns:2fr 1fr; gap:10px; margin-top:8px; }
    .btn { padding:14px; border-radius:40px; font-family:inherit; font-size:13px; font-weight:600; letter-spacing:.3px; cursor:pointer; border:1.5px solid; text-align:center; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:6px; transition:all .15s; }
    .btn.si { background:linear-gradient(135deg,#166baf,#3eaedd); border-color:transparent; color:#fff; box-shadow:0 8px 22px rgba(62,174,221,.3); }
    .btn.si:hover { filter:brightness(1.06); }
    .btn.no { background:transparent; border-color:var(--input-line); color:var(--tx2); }
    .btn.no:hover { border-color:var(--err); color:var(--err); }
    .btn.wa { background:var(--ok-soft); border-color:rgba(16,185,129,0.3); color:var(--ok-tx); }
    .btn.blue { background:linear-gradient(135deg,#166baf,#3eaedd); border-color:transparent; color:#fff; }
    .btn:disabled { opacity:.6; cursor:wait; }
    .estado { margin:22px 32px 0; padding:16px 18px; border-radius:16px; font-size:13px; line-height:1.55; }
    .estado strong { display:block; font-size:14px; margin-bottom:3px; }
    .estado.ok { background:var(--ok-soft); border:1px solid rgba(16,185,129,.28); color:var(--ok-tx); }
    .estado.no { background:var(--soft); border:1px solid var(--line); color:var(--tx2); }
    .estado.warn { background:var(--warn-soft); border:1px solid rgba(217,119,6,.3); color:var(--warn-tx); }
    .estado .btn { margin-top:12px; }
    .foot { padding:24px 32px 28px; text-align:center; font-size:11.5px; color:var(--tx3); line-height:1.7; }
    .foot strong { color:var(--tx); font-weight:600; }
    .foot a { color:var(--acc); text-decoration:none; font-weight:600; }
    .err { font-size:12px; color:var(--err); margin-top:8px; min-height:14px; }
    .loading, .missing { padding:60px 24px; text-align:center; color:var(--tx2); font-size:13px; }
    .g-hola { font-family:'Poppins',sans-serif; font-size:18px; font-weight:600; color:var(--tx); margin-bottom:6px; }
    .g-txt { font-size:13px; color:var(--tx2); line-height:1.6; margin:0 0 20px; }
    .g-in { margin-bottom:12px; font-size:15px; padding:13px 14px; }
    .g-err { font-size:12px; color:var(--err); min-height:16px; margin:-4px 0 8px; }
    .g-btn { width:100%; padding:15px; border:0; border-radius:40px; background:linear-gradient(135deg,#166baf,#3eaedd); color:#fff; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; box-shadow:0 8px 22px rgba(62,174,221,.3); }
    .g-nota { font-size:11px; color:var(--tx3); text-align:center; margin:14px 0 0; }
    @media (max-width:560px) {
      body { padding:0; }
      .card { border-radius:0; min-height:100vh; border:0; }
      .head { padding:24px 20px 22px; }
      .body { padding:20px 20px 0; }
      .total, .resp, .estado { margin-left:20px; margin-right:20px; }
      .foot { padding:20px 20px 24px; }
      .col-precio { display:none; }
      .total-amount { font-size:26px; }
      .btns { grid-template-columns:1fr; }
      .meta { flex-wrap:wrap; }
    }
  </style>
</head>
<body>
  <div class="card" id="card"><div class="loading">Cargando cotización…</div></div>

<script>
  const firebaseConfig = {
    apiKey:            "AIzaSyAFI1WRnS5VvFKp8sAuYiIsiT_wXdnNMKc",
    authDomain:        "dgp-group.firebaseapp.com",
    projectId:         "dgp-group",
    storageBucket:     "dgp-group.firebasestorage.app",
    messagingSenderId: "492620738391",
    appId:             "1:492620738391:web:e497fdfe134e6e781b5812"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const AVISO_URL = 'https://ayudante-dgp-bot.dgpgroupusa-llc.workers.dev/aviso';  // los avisos a Telegram pasan por el bot (el token no va en la página)
  const aviso = (col, id, texto, foto) => fetch(AVISO_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ col, id, texto, foto }) }).catch(() => {});
  const WA = '12398231738';

  const id = new URLSearchParams(location.search).get('id');
  let cot = null;
  // Idioma: ?lang=en en el enlace o la cotización creada en inglés
  let EN = new URLSearchParams(location.search).get('lang') === 'en';
  const L = (es, en) => EN ? en : es;

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function money(n) { return '$' + (Number(n) || 0).toFixed(2); }
  function hoyISO() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  function fechaLarga(iso) { return iso ? new Date(iso + 'T12:00:00').toLocaleDateString(EN ? 'en-US' : 'es-ES', { day:'2-digit', month:'long', year:'numeric' }) : '—'; }
  function estadoActual(c) { return c.estado === 'enviada' && c.venceEl && c.venceEl < hoyISO() ? 'vencida' : (c.estado || 'enviada'); }

  async function cargar() {
    const card = document.getElementById('card');
    if (!id) { card.innerHTML = `<div class="missing">${L('Link de cotización no válido.', 'Invalid quote link.')}</div>`; return; }
    try {
      const snap = await db.collection('cotizaciones').doc(id).get();
      if (!snap.exists) {
        card.innerHTML = `<div class="missing">${L('Esta cotización no existe o fue retirada.', 'This quote does not exist or was withdrawn.')}<br><br><a class="btn wa" href="https://wa.me/${WA}" target="_blank" rel="noopener">${L('Escríbenos por WhatsApp', 'Message us on WhatsApp')}</a></div>`;
        return;
      }
      cot = { _id: id, ...snap.data() };
      if (cot.idioma === 'en') EN = true;
      document.documentElement.lang = EN ? 'en' : 'es';
      if (!cot.clienteCorreo && estadoActual(cot) === 'enviada') pedirCorreo(document.getElementById('card'), cot, 'cotizaciones', id, render);
      else render();
    } catch (e) {
      card.innerHTML = `<div class="missing">${L('No pudimos cargar la cotización. Revisa tu conexión e intenta de nuevo.', 'We could not load the quote. Check your connection and try again.')}</div>`;
    }
  }

  /* ── Primera vez: pedir el correo del cliente antes de mostrar el documento ── */
  function pedirCorreo(card, doc, coleccion, id, alListo) {
    const tipo = coleccion === 'cotizaciones' ? L('cotización', 'quote') : L('factura', 'invoice');
    const nombre = String(doc.cli || '').split(' ')[0];
    card.innerHTML = `
      <div class="head">
        <div class="brandrow">
          <img src="/logo-white.png" alt="DGP Global Group">
          <div><div class="brand">DGP GLOBAL GROUP</div><div class="brand-sub">${L('Servicios Digitales Profesionales', 'Professional Digital Services')}</div></div>
        </div>
        <div class="title">${L('Tu ' + tipo, 'Your ' + tipo)}</div>
        <div class="docnum">N° ${esc(doc.docId || id)}</div>
      </div>
      <div style="padding:28px 32px 30px;">
        <div class="g-hola">${L('Hola', 'Hi')}${nombre ? ' ' + esc(nombre) : ''}</div>
        <p class="g-txt">${L(`Antes de ver tu ${tipo}, déjanos tu correo. Ahí te enviaremos tus facturas, recibos y avisos de tus servicios.`, `Before viewing your ${tipo}, please leave your email. We will send your invoices, receipts and service updates there.`)}</p>
        <label class="g-lbl" for="g-correo">${L('Correo electrónico *', 'Email *')}</label>
        <input class="g-in" type="email" id="g-correo" autocomplete="email" placeholder="${L('tucorreo@ejemplo.com', 'you@example.com')}">
        <label class="g-lbl" for="g-tel">${L('WhatsApp (opcional)', 'WhatsApp (optional)')}</label>
        <input class="g-in" type="tel" id="g-tel" autocomplete="tel" placeholder="+1 305 000 0000">
        <div class="g-err" id="g-err"></div>
        <button class="g-btn" id="g-btn">${L('Ver mi ' + tipo, 'View my ' + tipo)}</button>
        <p class="g-nota">${L('Solo lo usamos para enviarte información de tus servicios.', 'We only use it to send you information about your services.')}</p>
      </div>`;
    const guardar = async () => {
      const correo = document.getElementById('g-correo').value.trim().toLowerCase();
      const tel = document.getElementById('g-tel').value.trim().slice(0, 40);
      const err = document.getElementById('g-err');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(correo) || correo.length > 120) { err.textContent = L('Escribe un correo válido para continuar.', 'Enter a valid email to continue.'); return; }
      const btn = document.getElementById('g-btn');
      btn.disabled = true; btn.textContent = L('Guardando…', 'Saving…'); err.textContent = '';
      try {
        await db.collection(coleccion).doc(id).update({ clienteCorreo: correo, clienteTelefono: tel, clienteCorreoAt: firebase.firestore.FieldValue.serverTimestamp() });
        doc.clienteCorreo = correo; doc.clienteTelefono = tel;
        aviso(coleccion, id, `📧 ${doc.cli || 'Un cliente'} registró su correo al abrir la ${tipo} ${doc.docId || ''}:\n${correo}${tel ? '\n📱 ' + tel : ''}\n\nSe agenda solo en Clientes.`);
        alListo();
      } catch (e) {
        btn.disabled = false; btn.textContent = L('Ver mi ' + tipo, 'View my ' + tipo);
        err.textContent = L('No pudimos guardar tu correo. Intenta de nuevo.', 'We could not save your email. Please try again.');
      }
    };
    document.getElementById('g-btn').onclick = guardar;
    ['g-correo', 'g-tel'].forEach(i => document.getElementById(i).addEventListener('keydown', e => { if (e.key === 'Enter') guardar(); }));
    setTimeout(() => document.getElementById('g-correo')?.focus(), 50);
  }

  function render() {
    const c = cot;
    const est = estadoActual(c);
    const headCls = est === 'aceptada' || est === 'facturada' ? 'ok' : (est === 'rechazada' || est === 'vencida' ? 'no' : '');
    const badge = EN ? { enviada:'Pending approval', aceptada:'Accepted', rechazada:'Declined', facturada:'Approved · invoiced', vencida:'Expired' }[est] : { enviada:'Pendiente de aprobación', aceptada:'Aceptada', rechazada:'Rechazada', facturada:'Aprobada · facturada', vencida:'Vencida' }[est];
    const items = (c.items || []).map(it => `
      <tr>
        <td>${esc(it.s)}</td>
        <td class="ctr">${it.c || 1}</td>
        <td class="num col-precio">${money(it.p)}</td>
        <td class="num">${money(it.t)}</td>
      </tr>`).join('');

    let accion = '';
    if (est === 'enviada') {
      accion = `
        <div class="resp" id="resp">
          <h3>${L('¿Te parece bien esta propuesta?', 'Does this proposal work for you?')}</h3>
          <p>${L('Al aceptarla, te enviaremos la factura para comenzar. Si tienes dudas o quieres ajustar algo, escríbenos.', 'Once you accept it, we will send you the invoice to get started. If you have questions or want to adjust anything, message us.')}</p>
          <div class="field"><label>${L('Tu nombre', 'Your name')}</label><input id="r-nombre" maxlength="80" value="${esc(c.cli || '')}"></div>
          <div class="field"><label>${L('Comentario (opcional)', 'Comment (optional)')}</label><textarea id="r-nota" rows="2" maxlength="300" placeholder="${L('Ej. ¿Podemos empezar el lunes?', 'E.g. Can we start on Monday?')}"></textarea></div>
          <div class="btns">
            <button class="btn si" id="btn-si" onclick="responder('aceptada')">${L('Aceptar cotización', 'Accept quote')}</button>
            <button class="btn no" id="btn-no" onclick="responder('rechazada')">${L('Rechazar', 'Decline')}</button>
          </div>
          <div class="err" id="r-err"></div>
        </div>`;
    } else if (est === 'aceptada') {
      accion = `<div class="estado ok"><strong>${L('¡Cotización aceptada!', 'Quote accepted!')}</strong>${L('Gracias', 'Thank you')}${c.respondidoPor ? ', ' + esc(c.respondidoPor.split(' ')[0]) : ''}. ${L('En breve te enviaremos la factura para comenzar.', 'We will send you the invoice shortly to get started.')}</div>`;
    } else if (est === 'facturada') {
      accion = `<div class="estado ok"><strong>${L('Cotización aprobada', 'Quote approved')}</strong>${L('Ya generamos tu factura.', 'Your invoice is ready.')}${c.facturaId ? `<br><a class="btn blue" href="/factura-publica.html?id=${encodeURIComponent(c.facturaId)}">${L('Ver mi factura', 'View my invoice')}</a>` : ''}</div>`;
    } else if (est === 'rechazada') {
      accion = `<div class="estado no"><strong>${L('Cotización rechazada', 'Quote declined')}</strong>${L('Si cambias de opinión o quieres otra propuesta, escríbenos.', 'If you change your mind or want a different proposal, message us.')}<br><a class="btn wa" href="https://wa.me/${WA}?text=${encodeURIComponent(L('Hola, sobre la cotización ', 'Hi, about quote ') + (c.docId || '') + '...')}" target="_blank" rel="noopener">${L('Escribir por WhatsApp', 'Message us on WhatsApp')}</a></div>`;
    } else if (est === 'vencida') {
      accion = `<div class="estado warn"><strong>${L('Esta cotización venció el ', 'This quote expired on ')}${fechaLarga(c.venceEl)}</strong>${L('Los precios pueden haber cambiado. Escríbenos y te la actualizamos.', 'Prices may have changed. Message us and we will update it.')}<br><a class="btn wa" href="https://wa.me/${WA}?text=${encodeURIComponent(L('Hola, quiero actualizar la cotización ', 'Hi, I would like to update quote ') + (c.docId || ''))}" target="_blank" rel="noopener">${L('Pedir cotización actualizada', 'Request an updated quote')}</a></div>`;
    }

    document.title = `${L('Cotización', 'Quote')} ${c.docId || ''} — DGP Global Group`;
    document.getElementById('card').innerHTML = `
      <div class="head ${headCls}">
        <div class="brandrow">
          <img src="/logo-white.png" alt="DGP Global Group">
          <div><div class="brand">DGP GLOBAL GROUP</div><div class="brand-sub">${L('Servicios Digitales Profesionales', 'Professional Digital Services')}</div></div>
        </div>
        <div class="title">${L('Cotización', 'Quote')}</div>
        <div class="docnum">N° ${esc(c.docId || id)}</div>
        <div class="badge">${badge}</div>
      </div>
      <div class="body">
        <div class="meta">
          <div><div class="meta-label">${L('Fecha', 'Date')}</div><div class="meta-value">${esc(c.fecha || '—')}</div></div>
          ${c.emisor ? `<div style="text-align:center"><div class="meta-label">${L('Preparada por', 'Prepared by')}</div><div class="meta-value">${esc(c.emisor)}</div></div>` : ''}
          ${c.venceEl && est !== 'facturada' ? `<div style="text-align:right"><div class="meta-label">${L('Válida hasta', 'Valid until')}</div><div class="meta-value ${est === 'vencida' ? 'warn' : ''}">${fechaLarga(c.venceEl)}</div></div>` : ''}
        </div>
        <div class="client"><div class="client-label">${L('Preparada para', 'Prepared for')}</div><div class="client-name">${esc(c.cli || '—')}</div></div>
        ${c.nota ? `<div class="nota">${esc(c.nota)}</div>` : ''}
        <table>
          <thead><tr><th>${L('Descripción', 'Description')}</th><th class="ctr">${L('Cant.', 'Qty')}</th><th class="num col-precio">${L('Precio', 'Price')}</th><th class="num">${L('Importe', 'Amount')}</th></tr></thead>
          <tbody>${items}</tbody>
        </table>
      </div>
      <div class="total"><span class="total-label">Total</span><span class="total-amount">${money(c.total)}</span></div>
      ${accion}
      <div class="foot">${L('Esta cotización no es una factura. Los precios son válidos hasta la fecha indicada.', 'This quote is not an invoice. Prices are valid until the date shown.')}<br><strong>DGP Global Group</strong> · <a href="https://dgpglobalgroup.com" target="_blank" rel="noopener">dgpglobalgroup.com</a></div>`;
  }

  async function responder(estado) {
    const nombre = (document.getElementById('r-nombre').value || '').trim();
    const nota = (document.getElementById('r-nota').value || '').trim();
    const err = document.getElementById('r-err');
    err.textContent = '';
    if (estado === 'aceptada' && !nombre) { err.textContent = L('Escribe tu nombre para aceptar.', 'Enter your name to accept.'); return; }
    if (estado === 'rechazada' && !confirm(L('¿Seguro que quieres rechazar esta cotización?', 'Are you sure you want to decline this quote?'))) return;
    document.getElementById('btn-si').disabled = true;
    document.getElementById('btn-no').disabled = true;
    try {
      await db.collection('cotizaciones').doc(id).update({
        estado, respondidoPor: nombre.slice(0, 80), respuestaNota: nota.slice(0, 300),
        respondidoAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      Object.assign(cot, { estado, respondidoPor: nombre, respuestaNota: nota });
      aviso('cotizaciones', id,
          `${estado === 'aceptada' ? '✅ COTIZACIÓN ACEPTADA' : '❌ Cotización rechazada'}\n\n` +
          `🧾 ${cot.docId || id} · ${money(cot.total)}\n👤 ${cot.cli || '—'}${nombre && nombre !== cot.cli ? ' (' + nombre + ')' : ''}` +
          `${nota ? '\n💬 "' + nota + '"' : ''}\n\n${estado === 'aceptada' ? 'Conviértela en factura desde Facturación → Cotizaciones:\nhttps://adv.dgp-link.com/' : ''}`);
      render();
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    } catch (e) {
      err.textContent = L('No se pudo guardar tu respuesta. Intenta de nuevo o escríbenos por WhatsApp.', 'We could not save your response. Please try again or message us on WhatsApp.');
      document.getElementById('btn-si').disabled = false;
      document.getElementById('btn-no').disabled = false;
    }
  }

  cargar();
</script>
</body>
</html>
