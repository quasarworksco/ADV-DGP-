name = "ayudante-dgp-bot"
main = "worker.js"
compatibility_date = "2024-09-23"

# Ejecutar cerca de Groq (EE. UU.): Groq bloquea algunas regiones
[placement]
mode = "smart"

[triggers]
crons = ["0 9 1 * *"]

# Las variables secretas (TG_TOKEN y GROQ_API_KEY) se agregan
# desde el dashboard de Cloudflare — NO van aquí en texto plano.
# TG_TOKEN_NOTIF = token del bot de notificaciones (8938228745:...)
# FIREBASE_PROJECT = dgp-group (opcional, es el valor por defecto)
# FB_EMAIL / FB_PASSWORD = cuenta del equipo (con correo en /accesos) para leer facturas
