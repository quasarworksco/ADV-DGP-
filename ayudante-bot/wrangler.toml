name = "ayudante-dgp-bot"
main = "worker.js"
compatibility_date = "2024-09-23"

# Ejecutar SIEMPRE en EE. UU. (junto a Firebase, us-central): Groq bloquea
# algunas regiones (p. ej. cuando el Worker corre cerca de Venezuela).
[placement]
region = "gcp:us-central1"

# IA de Cloudflare (Workers AI) para leer comprobantes: no bloquea países
[ai]
binding = "AI"

[triggers]
# UTC: resumen mensual (día 1) · resumen diario 11:00 (7:00 VE) · respaldo domingo 12:00 (8:00 VE)
crons = ["0 9 1 * *", "0 11 * * *", "0 12 * * 0"]

# Las variables secretas (TG_TOKEN y GROQ_API_KEY) se agregan
# desde el dashboard de Cloudflare — NO van aquí en texto plano.
# TG_TOKEN_NOTIF = token del bot de notificaciones (8938228745:...)
# FIREBASE_PROJECT = dgp-group (opcional, es el valor por defecto)
# FB_EMAIL / FB_PASSWORD = cuenta del equipo (con correo en /accesos) para leer facturas
